name: Deploy Docs (Cloudflare Pages)

# Builds apps/docs as a static export and uploads the resulting `out/`
# directory to the Cloudflare Pages project `agenthost-docs` (custom
# domain docs.agenthost.pro).
#
# Required GHA repository secrets:
#   CLOUDFLARE_API_TOKEN  Pages:Edit + Account:Read (+ Zone:DNS:Edit if
#                         CF should also manage the custom-domain CNAME)
#   CLOUDFLARE_ACCOUNT_ID The Agenthost / Kensink Cloudflare account id
#
# One-time setup (already done):
#   - Pages project `agenthost-docs` created via API.
#   - docs.agenthost.pro bound as a custom domain.
#   - CNAME record `docs.agenthost.pro → agenthost-docs.pages.dev`
#     must exist in the agenthost.pro DNS zone for the domain to
#     activate. CF auto-creates it when the API token has DNS:Edit;
#     otherwise add it via dashboard.

on:
  push:
    branches: [kensink-v2]
    paths:
      - "apps/docs/**"
      - "packages/ui/**"
      - ".github/workflows/deploy-docs-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: kensink-v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm @multica/docs build` runs fumadocs-mdx (regenerates the
      # `.source/` index) then `next build` with `output: "export"`,
      # which writes the static site to apps/docs/out.
      - name: Build static export
        run: pnpm --filter @multica/docs build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/out --project-name=agenthost-docs --branch=main
