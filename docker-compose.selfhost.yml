# Self-hosting Docker Compose — starts PostgreSQL, backend, and frontend.
#
# Usage:
#   cp .env.example .env
#   # Edit .env — change JWT_SECRET at minimum
#   docker compose -f docker-compose.selfhost.yml up -d
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8080 (also used by CLI/daemon)

name: agenthost

# Network and volumes keep their existing on-disk names (`multica_default`,
# `multica_pgdata`, `multica_backend_uploads`) even though the project is now
# `agenthost`. Pinning explicit `name:` values bypasses Compose's project-prefix
# convention, so the new `agenthost-*` containers attach to the same persistent
# state and the Datadog compose file's `external: true` reference still resolves.
# Do NOT rename these — doing so creates fresh empty volumes and loses the DB.
networks:
  default:
    name: multica_default

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/multica-ai/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@kensink.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/callback}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-Agenthost by Kensink Labs}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    restart: unless-stopped

  frontend:
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/multica-ai/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      # Server-side env for marketing-side route handlers (e.g.
      # /api/landing/team-planner/{chat,capture}). Never exposed to the
      # browser — Next.js only forwards vars prefixed with NEXT_PUBLIC_.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Postgres for the planning_lead table (migration 066). The
      # frontend joins the same multica_default network so `postgres`
      # resolves to the postgres container.
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      # Resend for the plan-delivery emails. Falls back to console.warn
      # if RESEND_API_KEY is empty (lead saved, no emails sent).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      # Used to build absolute hotlink URLs in the delivered emails.
      AGENTHOST_APP_URL: ${AGENTHOST_APP_URL:-}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-}
      # Internal docs service URL — Next.js's /docs/* rewrite proxy in
      # apps/web/next.config.ts uses this to forward requests to the docs
      # container. Read at server boot, so a frontend restart is required
      # if the URL ever changes.
      DOCS_URL: ${DOCS_URL:-http://docs:4000}
    restart: unless-stopped

  docs:
    # Fumadocs-based docs site (apps/docs). Reachable only inside the
    # multica_default network — the frontend container proxies /docs/*
    # to docs:4000 via DOCS_URL. No host port is exposed.
    image: ${MULTICA_DOCS_IMAGE:-ghcr.io/multica-ai/multica-docs}:${MULTICA_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "4000"

volumes:
  pgdata:
    name: multica_pgdata
  backend_uploads:
    name: multica_backend_uploads
