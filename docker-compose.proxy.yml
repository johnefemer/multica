# Overlay for hosts that already run a shared nginx-proxy + acme-companion
# pair on ports 80/443 (agenthost-bt1). Use alongside the base file:
#
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.proxy.yml up -d
#
# It does two things:
#   1. Adds a `router` nginx container that owns the path split (/ws, /api/,
#      /api/landing/, /health, /) and publishes itself to the shared proxy
#      through VIRTUAL_HOST. Ports 80/443 are never bound by this stack.
#   2. Pulls the app's own published ports back to loopback. The single-tenant
#      host exposes 3000/8080/5432 on 0.0.0.0; behind a shared proxy nothing
#      outside the box should reach them directly.
#
# TLS: set LETSENCRYPT_HOST in .env once DNS actually points at this box.
# acme-companion issues over HTTP-01, so requesting a cert before the record
# is cut over just burns Let's Encrypt failure quota.

services:
  postgres:
    # Never reachable from outside the compose network.
    ports: !reset null

  backend:
    # Loopback only — scripts/agenthost-deploy.sh health-checks localhost:8080.
    ports: !override
      - "127.0.0.1:8080:8080"

  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"

  router:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./scripts/nginx/agenthost-router.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      # Consumed by nginx-proxy's docker-gen, not by nginx in this container.
      VIRTUAL_HOST: ${VIRTUAL_HOST:-agenthost.pro}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    networks:
      - default
      - proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  proxy:
    external: true
