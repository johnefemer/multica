# ── Agenthost in-stack router ────────────────────────────────────────────────
#
# For hosts where ports 80/443 already belong to a shared nginx-proxy +
# acme-companion pair (agenthost-bt1). The shared proxy terminates TLS and
# forwards the whole vhost here; this container then applies the same
# path split the single-tenant host does in system nginx.
#
#   nginx-proxy :443 → router :80
#       /ws              → backend  :8080  (WebSocket upgrade)
#       /api/landing/*   → frontend :3000  (marketing-side route handlers)
#       /api/*           → backend  :8080  (REST — product API)
#       /health          → backend  :8080
#       /*               → frontend :3000
#
# Mounted read-only by docker-compose.proxy.yml. The single-tenant variant
# lives in agenthost.conf and runs on the host, not in a container.
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, re-resolved every 10s. Upstreams are named in
    # variables on purpose: a static `upstream` block resolves once at
    # startup, so recreating backend/frontend without recreating the router
    # would leave it 502-ing against a stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend "frontend:3000";
    set $backend  "backend:8080";

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # ── WebSocket (/ws) ──────────────────────────────────────────────────────
    location /ws {
        proxy_pass       http://$backend$request_uri;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ── Marketing-side API (Next.js route handlers) ──────────────────────────
    # Specific match — must come BEFORE the generic /api/ location below,
    # otherwise nginx prefix matching sends these to the Go backend (404).
    location /api/landing/ {
        proxy_pass       http://$frontend$request_uri;
        proxy_set_header Connection '';

        # The chat endpoint streams Anthropic responses for up to ~3 min on
        # complex projects. Unbuffer here, and tell the shared nginx-proxy in
        # front of us to do the same — it honours X-Accel-Buffering, which is
        # how we avoid disabling buffering for every other app on the host.
        proxy_buffering off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 300s;
    }

    # ── Backend API (/api/* and /health) ─────────────────────────────────────
    location /api/ {
        proxy_pass       http://$backend$request_uri;
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }

    location /health {
        proxy_pass       http://$backend$request_uri;
        proxy_set_header Connection '';
        access_log off;
    }

    # ── Frontend (everything else) ───────────────────────────────────────────
    location / {
        proxy_pass       http://$frontend$request_uri;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
